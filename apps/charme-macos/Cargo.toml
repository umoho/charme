[package]
name = "charme-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "charme"
path = "src/main.rs"

[features]
debug-ui = []

[dependencies]
charme-core = { path = "../../crates/charme-core" }
charme-renderer = { path = "../../crates/charme-renderer" }
charme-shader = { path = "../../crates/charme-shader" }

[target.'cfg(target_os = "macos")'.dependencies]
cacao.workspace = true
core-graphics.workspace = true
foreign-types.workspace = true
url.workspace = true

[build-dependencies]
apple-plist = { version = "1.0.1", default-features = false, features = ["openstep", "serde"] }

[lints]
workspace = true
