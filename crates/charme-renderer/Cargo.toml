[package]
name = "charme-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Development-only switch; do not enable it for release bundles.
dynamic-linking = ["bevy/dynamic_linking"]

[dependencies]
# `bevy_pbr` supplies the renderer's 3D material stack. `bevy_pmx` supplies
# the asset/image/render features and PMX texture codecs transitively.
# `multi_threaded` is intentionally omitted: the renderer owns its worker
# thread and runs the Bevy app synchronously.
bevy = { workspace = true, features = ["bevy_gizmos_render", "bevy_pbr"] }
bevy_pmx.workspace = true
charme-bevy = { path = "../charme-bevy" }
charme-core = { path = "../charme-core" }
zip.workspace = true

[lints]
workspace = true
