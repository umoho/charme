[package]
name = "charme-bevy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# `bevy_pbr` transitively enables the asset, image, mesh, render, and shader
# APIs used by the reusable material; listing them again does not reduce the graph.
bevy = { workspace = true, features = ["bevy_pbr"] }
charme-core = { path = "../charme-core" }
charme-shader = { path = "../charme-shader" }
thiserror.workspace = true

[lints]
workspace = true
